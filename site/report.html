<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Judge My 𝕏</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:920px}
.hero{display:grid;grid-template-columns:1fr 250px;gap:64px;align-items:center;margin:40px 0 0}
.ident{display:flex;align-items:center;gap:12px;margin:0 0 30px;width:fit-content;color:inherit}
.ident:hover{text-decoration:none}
.ident:hover b{text-decoration:underline}
.ident .avatar{width:48px;height:48px}
.ident b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.ident span{display:block;color:var(--muted);font-size:14px}
.eyebrow{display:block;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.archetype{margin:0 0 30px}
.archetype b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.roast p{margin:0;font-size:42px;font-weight:600;line-height:1.1;letter-spacing:-.035em}
.actions{display:flex;gap:12px;margin:34px 0 0}
.ring{position:relative;width:250px;height:250px;background:var(--card);border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.07)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:84px;font-weight:600;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring span{font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;border-top:1px solid var(--line);margin:56px 0 0;padding:26px 0 0}
.cats span{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.cats b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;margin:4px 0 10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--fg)}
.section{margin:64px 0 0}
.fixes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fix,.statline div,.post blockquote,.hooks div div,.feed div{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.fix{padding:22px}
.fix i{display:block;font-style:normal;font-size:13px;font-weight:500;color:var(--muted);line-height:1}
.fix b{display:block;font-size:17px;font-weight:600;line-height:1.35;margin:14px 0 8px}
.fix span{color:var(--soft);font-size:15px;line-height:1.55}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--fill);border-radius:12px;padding:4px;scrollbar-width:none}
.tabs button{flex:1;background:none;border:0;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500;padding:9px 12px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel{padding:28px 0 0}
.panel h3{font-size:18px;font-weight:600;margin:44px 0 16px}
.panel h3:first-child{margin-top:0}
.why .row{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line);border-radius:0}
.why .row:hover{background:none}
.why .row:first-child{border-top:0;padding-top:4px}
.why .row b{font-size:15px;font-weight:500;color:var(--muted)}
.why .row b span{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--fg);margin-top:4px}
.why .row p{margin:0;color:var(--soft);font-size:15px;line-height:1.6}
.posts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.post h4,.hooks h4{margin:0 0 12px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.post blockquote{margin:0;padding:14px 16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.post .embed:empty{display:none}
.post .meta{color:var(--muted);font-size:13px;margin:10px 0}
.post p,.note{margin:0;font-size:15px;line-height:1.6;color:var(--soft)}
.hooks{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.hooks div div{padding:11px 14px;margin:0 0 10px;font-size:14px;line-height:1.45;word-break:break-word}
.hooks small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
ul.works{margin:0;padding-left:20px}
ul.works li{margin:0 0 14px;line-height:1.6;font-size:16px;color:var(--soft)}
.topics .r{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 80px;gap:16px;align-items:center;margin:0 0 16px;font-size:15px}
.topics .r b{font-weight:600}
.topics .r small{color:var(--muted);font-size:13px;display:block;font-weight:400;margin-top:2px}
.topics .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.topics .track i{display:block;height:100%;background:var(--fg);border-radius:4px}
.topics .v{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px;text-align:right}
.caption{color:var(--muted);font-size:13px;margin:10px 0 0}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 24px}
.statline div{padding:16px}
.statline b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.statline span{font-size:13px;color:var(--muted)}
svg{width:100%;height:auto;display:block}
.log{font-size:14px}
.log div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.log div:first-child{border-top:0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;width:44px;flex:none}
.log span{color:var(--muted)}
.working{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500;margin:12px 0 0}
.feed{position:relative;height:330px;overflow:hidden;margin-top:24px;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.feed:empty{height:0}
.feed div{padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.4;animation:slide .5s ease-out both}
.feed small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.launcher{position:fixed;right:24px;bottom:24px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--fg);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.launcher[hidden]{display:none}
.launcher svg{width:20px;height:20px}
.chat{position:fixed;right:24px;bottom:24px;z-index:31;width:344px;height:clamp(340px,calc(100vh - 460px),520px);display:flex;flex-direction:column;background:var(--card);border:1px solid #e5e5ea;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.14);overflow:hidden}
.chat[hidden]{display:none}
.chat header{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.face{position:relative;width:36px;height:36px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.face.sm{width:28px;height:28px;font-size:12px}
.chat header .face::after{content:'';position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#30d158;border:2px solid var(--card)}
.chat .title{flex:1;min-width:0}
.chat .title b{display:block;font-size:15px;font-weight:600}
.chat .title span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .close{width:34px;height:34px;border-radius:50%;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.chat .close:hover{background:var(--fill)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.turn{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.turn.me{align-self:flex-end}
.msg{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.me .msg{background:var(--fg);color:#fff;border-bottom-right-radius:4px}
.bot .msg{background:var(--fill);color:var(--fg);border-bottom-left-radius:4px}
.bot .msg.err{color:#d70015}
.steps{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);padding:0 0 0 36px}
.steps div{display:flex;align-items:center;gap:8px}
.steps .spinner{width:12px;height:12px;border-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 0 36px}
.chips button{background:var(--card);border:1px solid var(--edge);color:var(--fg);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer}
.chips button:hover{background:#f5f5f7}
.chat form{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;background:var(--fill);border:1px solid transparent;border-radius:999px;color:var(--fg);font-size:15px;padding:11px 16px;outline:0}
.chat input:focus{background:var(--card);border-color:var(--edge)}
.chat .send{width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.chat .send svg{width:18px;height:18px}
.chat .send:disabled{opacity:.35;cursor:default}
footer{padding-bottom:110px}
@media (max-width:760px){
  .hero{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;margin-top:24px}
  .hero .left{display:contents}
  .ident{order:1;margin:0;text-align:left}
  .ring{order:2;width:200px;height:200px;margin:28px 0 30px}
  .archetype{order:3;margin-bottom:22px}
  .archetype b{font-size:24px}
  .ring b{font-size:64px}
  .ring span{font-size:12px}
  .roast{order:4}
  .roast p{font-size:28px}
  .actions{order:5;margin-top:26px;justify-content:center}
  .cats{grid-template-columns:1fr;gap:14px;margin-top:44px}
  .cats>div{display:grid;grid-template-columns:100px 34px 1fr;align-items:center;gap:12px}
  .cats b{font-size:17px;margin:0}
  .cats span{font-size:15px}
  .fixes,.posts,.hooks{grid-template-columns:1fr}
  .why .row{grid-template-columns:1fr;gap:8px}
  .why .row b span{display:inline;font-size:16px;margin-left:8px}
  .statline{grid-template-columns:1fr 1fr}
  .topics .r{grid-template-columns:1fr auto}
  .topics .track{grid-column:1/-1;order:3}
  .section{margin-top:52px}
  .tabs button{flex:none}
  .chat{right:0;bottom:0;width:100%;height:100%;border-radius:0;border:0}
  .launcher{right:16px;bottom:16px;width:56px;height:56px;padding:0;justify-content:center;font-size:0;gap:0}
  .launcher svg{width:24px;height:24px}
}
</style>
</head><body><div class="wrap">
<header><a class="logo" href="/">Judge My 𝕏</a><nav><a href="/how">How it works</a><!--REPO_NAV--><a href="https://www.omnara.com" target="_blank">Built on Omnara</a></nav></header>
<main id="main"><div class="working"><div class="spinner"></div>Loading…</div></main>
<footer>A side project by <a href="https://x.com/%X_HANDLE%" target="_blank">@%X_HANDLE%</a>. Each rating is done by its own AI agent on <a href="https://www.omnara.com" target="_blank">Omnara</a>. Not affiliated with X.</footer>
</div>
<script type="module">
import { scoreColor, tier, fmt, realName } from '/ui.js'
const handle = location.pathname.slice(2)
const LAUNCH = '%LAUNCH_URL%'
const main = document.getElementById('main')
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
const LABELS = { content: 'Content', consistency: 'Consistency', engagement: 'Engagement', profile: 'Profile', originality: 'Originality' }

function logList(log, t0) {
  const box = el('div', 'log')
  for (const e of log) {
    const row = el('div'); row.append(el('time', null, `${Math.max(0, Math.round((e.t - t0) / 1000))}s`))
    const s = el('div'); s.style.cssText = 'border:0;padding:0;display:block'
    s.append(e.step); if (e.detail) { s.append(' '); s.append(el('span', null, `· ${e.detail}`)) }
    row.append(s); box.append(row)
  }
  return box
}

function timeline(points) {
  const W = innerWidth < 600 ? 380 : 700, H = 200, pad = 34, pts = points.filter((p) => p[1] > 0)
  if (pts.length < 3) return el('p', 'caption', 'Not enough data for a chart.')
  const t = pts.map((p) => Date.parse(p[0])), t0 = Math.min(...t), t1 = Math.max(...t)
  const v = pts.map((p) => Math.log10(p[1] + 1)), vmax = Math.max(...v, 1)
  const x = (d) => pad + ((Date.parse(d) - t0) / Math.max(1, t1 - t0)) * (W - pad * 2), y = (n) => H - pad - (Math.log10(n + 1) / vmax) * (H - pad * 2)
  const dots = pts.map((p) => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="4" fill="${p[3] ? '#c7c7cc' : '#1d1d1f'}" fill-opacity="${p[3] ? 0.9 : 0.85}"/>`).join('')
  const ticks = [10, 100, 1000, 10000, 100000, 1000000].filter((n) => Math.log10(n + 1) <= vmax).map((n) => `<line x1="${pad}" x2="${W - pad}" y1="${y(n)}" y2="${y(n)}" stroke="#ececf0"/><text x="${pad - 6}" y="${y(n) + 4}" fill="#6e6e73" font-size="13" text-anchor="end">${fmt(n)}</text>`).join('')
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`)
  s.innerHTML = ticks + dots + `<text x="${pad}" y="${H - 6}" fill="#6e6e73" font-size="13">${new Date(t0).toLocaleDateString()}</text><text x="${W - pad}" y="${H - 6}" fill="#6e6e73" font-size="13" text-anchor="end">${new Date(t1).toLocaleDateString()}</text>`
  const wrap = el('div'); wrap.append(s, el('p', 'caption', 'Views per post. Dark: your own posts. Light: replies.'))
  return wrap
}

function hours(byHour) {
  const off = -new Date().getTimezoneOffset() / 60
  const local = [...Array(24).keys()].map((h) => byHour[(((h - off) % 24) + 24) % 24])
  const max = Math.max(...local.map((b) => b.medianViews), 1), W = innerWidth < 600 ? 380 : 700, H = 160, bw = (W - 40) / 24
  const bars = local.map((b, h) => { const bh = (b.medianViews / max) * (H - 40); return `<rect x="${20 + h * bw + 2}" y="${H - 22 - bh}" width="${bw - 4}" height="${Math.max(bh, b.count ? 2 : 0)}" rx="3" fill="${b.medianViews === max ? '#1d1d1f' : '#d2d2d7'}" fill-opacity="${b.count ? 1 : 0.35}"/>${h % 3 === 0 ? `<text x="${20 + h * bw + bw / 2}" y="${H - 6}" fill="#6e6e73" font-size="13" text-anchor="middle">${h}h</text>` : ''}` }).join('')
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`); s.innerHTML = bars
  const wrap = el('div'); wrap.append(s, el('p', 'caption', 'Typical views by the hour you posted, in your local time. The dark bar is your best hour.'))
  return wrap
}

let widgets
const loadWidgets = () => (widgets ??= new Promise((resolve) => { const sc = document.createElement('script'); sc.src = 'https://platform.twitter.com/widgets.js'; sc.async = true; sc.onload = () => resolve(window.twttr); sc.onerror = () => resolve(null); document.head.append(sc) }))

function postBox(title, item) {
  const box = el('div', 'post'); box.append(el('h4', null, title))
  const embed = el('div', 'embed'), q = el('blockquote', null, item.post?.text ?? '')
  box.append(embed, q)
  if (item.post) {
    const m = el('div', 'meta'); m.innerHTML = `${fmt(item.post.views)} views · ${fmt(item.post.likes)} likes · <a target="_blank">open</a>`; m.querySelector('a').href = item.post.url || `https://x.com/${handle}/status/${item.id}`; box.append(m)
    if (!item.post.hidden) loadWidgets().then((tw) => tw?.widgets?.createTweet(item.id, embed, { theme: 'light', dnt: true, conversation: 'none', align: 'center' })).then((tweet) => { if (tweet) q.remove(); else embed.replaceChildren() }).catch(() => embed.replaceChildren())
  }
  box.append(el('p', null, item.why))
  return box
}

function scoresPanel(report) {
  const box = el('div', 'why')
  for (const [k, b] of Object.entries(report.breakdown)) {
    const row = el('div', 'row'), name = el('b', null, LABELS[k]), s = el('span', null, b.score.toFixed(1)); name.append(s)
    row.append(name, el('p', null, b.note)); box.append(row)
  }
  return [box]
}

function postsPanel(report, openers) {
  const posts = el('div', 'posts'); posts.append(postBox('Best post', report.best_post), postBox('Worst post', report.worst_post))
  const out = [posts]
  if (report.hooks) {
    out.push(el('h3', null, 'Your hooks'), el('p', 'note', report.hooks))
    if (openers?.top?.length && openers?.bottom?.length) {
      const grid = el('div', 'hooks')
      for (const [title, list] of [['Your hits open with', openers.top], ['Your flops open with', openers.bottom]]) {
        const col = el('div'); col.append(el('h4', null, title))
        for (const o of list) { const d = el('div', null, o.text); d.append(el('small', null, `${fmt(o.views)} views`)); col.append(d) }
        grid.append(col)
      }
      out.push(grid)
    }
  }
  return out
}

function worksPanel(report, stats) {
  const works = el('ul', 'works'); for (const w of report.what_works) works.append(el('li', null, w))
  const out = [works]
  if (report.topics?.length) {
    const box = el('div', 'topics'), max = Math.max(...report.topics.map((t) => t.medianViews), 1)
    for (const t of report.topics) {
      const r = el('div', 'r'), name = el('b', null, t.name); name.append(el('small', null, `${t.share}% of your posts`))
      const track = el('div', 'track'), fill = el('i'); fill.style.width = `${Math.max(2, (t.medianViews / max) * 100)}%`; track.append(fill)
      r.append(name, track, el('span', 'v', `${fmt(t.medianViews)} views`)); box.append(r)
    }
    out.push(el('h3', null, 'What you post about'), box, el('p', 'note', report.topics_note), el('p', 'caption', 'Typical views per post on each topic.'))
  }
  out.push(el('h3', null, 'When you do best'), hours(stats.byHourUTC))
  return out
}

function numbersPanel(stats, tl) {
  const line = el('div', 'statline')
  for (const [big, small] of [[stats.postsPerWeek, 'posts per week'], [`${stats.replyShare}%`, 'of posts are replies'], [fmt(stats.originals.medianViews), 'typical views, own posts'], [fmt(stats.replies.medianViews), 'typical views, replies']]) { const d = el('div'); d.append(el('b', null, String(big)), el('span', null, small)); line.append(d) }
  return [el('h3', null, `Your last ${stats.analyzed} posts`), line, timeline(tl)]
}

function tabs(list) {
  const bar = el('div', 'tabs'), panel = el('div', 'panel'), wrap = el('div', 'section')
  list.forEach(([name, build], i) => {
    const b = el('button', null, name)
    b.onclick = () => { bar.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); bar.scrollTo({ left: b.offsetLeft - 20, behavior: 'smooth' }); panel.replaceChildren(...build()) }
    bar.append(b); if (i === 0) b.click()
  })
  wrap.append(bar, panel)
  return wrap
}

function render({ profile, stats, report, timeline: tl, log, openers }) {
  main.replaceChildren()
  const color = scoreColor(report.score)
  const ident = el('a', 'ident'); ident.href = `https://x.com/${profile.handle}`; ident.target = '_blank'
  const img = el('img', 'avatar'); img.src = profile.avatar; img.alt = ''
  const shown = realName(profile.name, profile.handle), who = el('div')
  who.append(el('b', null, shown ?? `@${profile.handle}`), el('span', null, `${shown ? `@${profile.handle} · ` : ''}${fmt(profile.followers)} followers`))
  ident.append(img, who)

  const label = (text) => el('small', 'eyebrow', text)
  const roast = el('div', 'roast'); roast.append(label('THE ROAST'), el('p', null, report.verdict))
  const arch = el('div', 'archetype'), name = el('b', null, report.archetype ?? ''); arch.append(label('ARCHETYPE'), name)

  const actions = el('div', 'actions')
  const intent = (text, url) => `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`
  const tw = el('a', 'btn', 'Share on 𝕏'); tw.href = intent(`an AI agent just roasted @${profile.handle}'s 𝕏 account`, location.origin + location.pathname); tw.target = '_blank'
  const get = el('a', 'btn ghost', 'Get yours on 𝕏'); get.href = LAUNCH; get.target = '_blank'
  actions.append(tw, get)

  const left = el('div', 'left'); left.append(ident, ...(report.archetype ? [arch] : []), roast, actions)
  const C = 2 * Math.PI * 111, ring = el('div', 'ring')
  ring.innerHTML = `<svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="111" fill="none" stroke="#f0f0f3" stroke-width="8"/><circle cx="125" cy="125" r="111" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(Math.max(0.02, report.score / 10) * C).toFixed(1)} ${C.toFixed(1)}"/></svg><div><b></b><span></span></div>`
  ring.querySelector('b').textContent = report.score.toFixed(1)
  ring.querySelector('span').textContent = tier(report.score)?.toUpperCase() ?? 'OUT OF 10'
  const hero = el('div', 'hero'); hero.append(left, ring)

  const cats = el('div', 'cats')
  for (const [k, b] of Object.entries(report.breakdown)) {
    const item = el('div'), s = el('b', null, b.score.toFixed(1))
    const bar = el('div', 'bar'), fill = el('i'); fill.style.width = `${b.score * 10}%`; bar.append(fill)
    item.append(el('span', null, LABELS[k]), s, bar); cats.append(item)
  }

  const fixes = el('div', 'fixes')
  report.fixes.forEach((f, i) => { const d = el('div', 'fix'); d.append(el('i', null, String(i + 1)), el('b', null, f.title), el('span', null, f.detail)); fixes.append(d) })

  main.append(hero, cats, tabs([
    ['Scores', () => scoresPanel(report)],
    ['Best & worst', () => postsPanel(report, openers)],
    ['What works', () => worksPanel(report, stats)],
    ['What to fix', () => [fixes]],
    ['Numbers', () => numbersPanel(stats, tl)],
    ['Agent log', () => [logList(log, log[0]?.t ?? 0)]],
  ]))
  chat(profile, report)
}

function chat(profile, report) {
  const launcher = el('button', 'launcher')
  launcher.setAttribute('aria-label', 'Ask the judge'); launcher.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask the judge'
  const box = el('div', 'chat'); box.hidden = true
  box.innerHTML = '<header><div class="face">J</div><div class="title"><b>The judge</b><span></span></div><button class="close" aria-label="Minimize">–</button></header><div class="msgs"></div><form><input maxlength="280" placeholder="Message the judge"><button class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>'
  box.querySelector(".title span").textContent = "AI agent on Omnara"
  const msgs = box.querySelector('.msgs'), form = box.querySelector('form'), input = box.querySelector('input'), go = box.querySelector('.send')
  const scroll = () => (msgs.scrollTop = msgs.scrollHeight)
  const said = (who, text, err) => { const r = el('div', `turn ${who}`), m = el('div', `msg${err ? ' err' : ''}`, text); if (who === 'bot') r.append(el('div', 'face sm', 'J')); r.append(m); msgs.append(r) }
  const stepsEl = (list, live) => {
    const s = el('div', 'steps')
    for (const t of list) s.append(el('div', null, `↳ ${t}`))
    if (live) { const d = el('div'); d.append(el('span', 'spinner'), list.length ? 'Working…' : 'Thinking…'); s.append(d) }
    return s
  }
  said('bot', `Hey, I'm the agent that rated @${profile.handle} a ${report.score.toFixed(1)}. Ask me anything about the account.`)
  const chips = el('div', 'chips')
  for (const c of ['Why this score?', 'What should I post tomorrow?', 'Rewrite my worst post']) { const b = el('button', null, c); b.type = 'button'; b.onclick = () => send(c); chips.append(b) }
  msgs.append(chips)

  async function send(text) {
    text = text.trim(); if (text.length < 3 || go.disabled) return
    input.value = ''; go.disabled = true; chips.remove()
    said('me', text)
    const steps = []
    let node = stepsEl(steps, true), answer = null, error = null
    const redraw = (live) => { const next = stepsEl(steps, live); node.replaceWith(next); node = next; scroll() }
    msgs.append(node); scroll()
    try {
      const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ handle, question: text }) })
      if (!res.ok) error = (await res.json().catch(() => ({}))).error ?? 'Something went wrong.'
      else {
        const reader = res.body.getReader(), dec = new TextDecoder()
        let buf = ''
        for (;;) {
          const { value, done } = await reader.read()
          if (done) break
          buf += dec.decode(value, { stream: true })
          let i
          while ((i = buf.indexOf('\n')) >= 0) {
            const m = JSON.parse(buf.slice(0, i)); buf = buf.slice(i + 1)
            if (m.step) { steps.push(m.step); redraw(true) }
            if (m.answer) answer = m.answer
            if (m.error) error = m.error
          }
        }
      }
    } catch { error = 'Something went wrong. Try again.' }
    if (steps.length) redraw(false); else node.remove()
    said('bot', answer ?? error ?? 'The judge could not answer that.', !answer)
    go.disabled = false; scroll(); input.focus()
  }

  form.onsubmit = (e) => { e.preventDefault(); send(input.value) }
  const toggle = (open) => { box.hidden = !open; launcher.hidden = open; if (open) scroll() }
  launcher.onclick = () => { toggle(true); if (innerWidth > 760) input.focus() }
  box.querySelector('.close').onclick = () => toggle(false)
  document.body.append(launcher, box)
  toggle(innerWidth >= 1100)
}

const shown = new Set()
let feed = null
function waiting(s) {
  if (!feed) {
    main.replaceChildren()
    feed = el('div', 'feed')
    main.append(el('h1'), el('div', 'working'), feed, el('div', 'live'))
  }
  const who = s.screen_name ?? handle
  main.querySelector('h1').textContent = `Judging @${who}`
  main.querySelector('.working').replaceChildren(el('div', 'spinner'), s.status === 'queued' ? `In line${s.position ? ` (#${s.position})` : ''}…` : `The judge is investigating @${who}…`)
  const live = main.querySelector('.live')
  if (s.log?.length) { const c = el('section', 'card'); c.append(el('h2', null, 'Live'), logList(s.log, s.log[0].t)); live.replaceChildren(c) }
  let delay = 0
  for (const e of s.log ?? []) for (const p of e.posts ?? []) {
    const k = p.text + p.views
    if (shown.has(k)) continue
    shown.add(k)
    const d = el('div', null, p.text); d.append(el('small', null, `${fmt(p.views)} views · ${fmt(p.likes)} likes`)); d.style.animationDelay = `${delay}ms`; delay += 250
    feed.prepend(d)
  }
  while (feed.children.length > 12) feed.lastChild.remove()
}

function notRated(text) {
  main.replaceChildren(el('h1', null, `@${handle}`), el('p', 'lede', text))
  const b = el('a', 'btn', 'Get rated on 𝕏'); b.href = LAUNCH; b.target = '_blank'
  main.append(b)
}

async function poll() {
  const r = await fetch(`/api/rating/${handle}`)
  if (r.status === 404) return notRated('This account hasn’t been rated yet. Reply to the post on 𝕏 and an AI agent will rate it.')
  const s = await r.json()
  if (s.status === 'done' && s.record) return render(s.record)
  if (s.status === 'failed') return notRated(s.error || 'Something went wrong with this rating.')
  waiting(s); setTimeout(poll, 1500)
}
poll()
</script>
